name: Clear Copilot review requests

on:
  pull_request:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: write

jobs:
  clear:
    if: >-
      github.event.pull_request.user.login == 'Copilot' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-24.04
    steps:
      - name: Remove requested reviewer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const reviewer = context.payload.requested_reviewer?.login;
            const team = context.payload.requested_team?.slug;

            if (!reviewer && !team) {
              core.info("No requested reviewer or team to remove.");
              return;
            }

            await github.rest.pulls.removeRequestedReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: reviewer ? [reviewer] : [],
              team_reviewers: team ? [team] : [],
            });

            core.info(`Removed review request for ${reviewer ?? team}.`);
