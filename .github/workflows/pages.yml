name: pages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned rust-toolchain action
        with:
          toolchain: 1.99.0
      - name: Build CLI for command-example validation
        run: cargo build --locked -p tasc
      - name: Verify README-generated landing page
        run: python3 docs/site/generate.py --check
      - name: Test documentation and release tooling
        run: |
          python3 -m unittest discover -s docs/site -p 'test_*.py'
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate links, HTML, accessibility, commands, and version
        run: python3 docs/site/validate.py --binary target/debug/tasc
      - name: Check external links
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 docs/site/validate.py --binary target/debug/tasc --check-external
      - name: Validate published release documentation version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 docs/site/validate.py --binary target/debug/tasc --version "${RELEASE_TAG#v}"
      - name: Configure Pages
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
