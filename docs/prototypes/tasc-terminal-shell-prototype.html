<!doctype html>
<!-- PROTOTYPE: terminal shell layout exploration for issue "Prototype the target terminal shell before implementation". -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TASC terminal shell prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #11151d;
      --panel-2: #171d28;
      --line: #2a3444;
      --muted: #8793a7;
      --text: #e8edf5;
      --cyan: #6ee7f9;
      --magenta: #e5a5ff;
      --blue: #9abaff;
      --yellow: #ffd166;
      --red: #ff8e8e;
      --green: #8be28b;
      --next: #72d5cf;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #05070a;
      color: var(--text);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .stage {
      min-height: 100vh;
      padding: 28px 28px 92px;
      display: grid;
      place-items: center;
    }
    .terminal {
      width: min(1180px, 100%);
      height: min(760px, calc(100vh - 120px));
      min-height: 560px;
      overflow: hidden;
      border: 1px solid #344154;
      border-radius: 12px;
      background: var(--bg);
      box-shadow: 0 24px 70px #000b, 0 0 0 1px #ffffff08 inset;
      display: flex;
      flex-direction: column;
    }
    .chrome {
      height: 38px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: #0d1118;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff6b6b; }
    .dot:nth-child(2) { background: #ffd166; }
    .dot:nth-child(3) { background: #8be28b; }
    .chrome-title { margin-left: 8px; }
    .banner {
      padding: 18px 22px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(120deg, #101927, #11131d 60%, #1b1122);
    }
    .transcript > .banner {
      margin: -18px -22px 10px;
    }
    .banner pre {
      margin: 0;
      color: var(--cyan);
      font-weight: 700;
      font-size: clamp(8px, 1vw, 13px);
      line-height: 1.05;
    }
    .banner-note { margin-top: 8px; color: var(--muted); }
    .workspace { min-height: 0; flex: 1; display: flex; }
    .transcript {
      min-width: 0;
      overflow: auto;
      padding: 18px 22px;
      flex: 1;
      scrollbar-color: #46536a transparent;
    }
    .row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 16px;
      padding: 9px 0;
      border-bottom: 1px solid #ffffff08;
    }
    .label { white-space: nowrap; }
    .body { color: #dbe2ee; }
    .dim { color: var(--muted); }
    .input .label { color: var(--cyan); }
    .tasc .label { color: var(--magenta); }
    .info .label { color: var(--blue); }
    .working .label { color: var(--cyan); }
    .warning .label { color: var(--yellow); }
    .error .label { color: var(--red); }
    .done .label { color: var(--green); }
    .next .label { color: var(--next); }
    .code {
      margin-top: 8px;
      padding: 10px 12px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #070a0f;
      color: #cbd5e1;
    }
    .composer {
      flex: 0 0 auto;
      padding: 12px 18px 10px;
      border-top: 1px solid var(--line);
      background: #0f141d;
    }
    .prompt-line {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 52px;
      padding: 10px 12px;
      border: 1px solid #42516a;
      border-radius: 6px;
      background: #0a0d13;
    }
    .prompt { color: var(--cyan); font-weight: 700; }
    .draft { color: #f3f6fb; }
    .cursor { color: var(--cyan); animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .palette {
      margin-bottom: 8px;
      border: 1px solid #40516d;
      border-radius: 6px;
      background: #101722;
      overflow: hidden;
    }
    .palette-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 7px 10px;
      color: #c6d0df;
    }
    .palette-row.selected { color: #fff; background: #263957; }
    .palette-row small { color: var(--muted); }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .footer strong { color: #dbe5f4; font-weight: 500; }
    .footer-right { text-align: right; }
    .sidebar {
      width: 270px;
      flex: 0 0 270px;
      overflow: auto;
      padding: 16px;
      border-left: 1px solid var(--line);
      background: #0c1119;
    }
    .side-title {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .side-item {
      padding: 9px 10px;
      border-left: 2px solid transparent;
      color: #aab6c9;
    }
    .side-item.active {
      border-left-color: var(--cyan);
      background: #142334;
      color: #fff;
    }
    .side-item small { display: block; margin-top: 3px; color: var(--muted); }
    .command-rail {
      width: 230px;
      flex: 0 0 230px;
      padding: 18px 14px;
      border-right: 1px solid var(--line);
      background: #0d131d;
    }
    .rail-item {
      display: block;
      width: 100%;
      margin-bottom: 5px;
      padding: 9px 10px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      color: #aab6c9;
    }
    .rail-item.active, .rail-item:hover { background: #1b2b42; color: #fff; }
    .rail-item b { color: var(--cyan); font-weight: 500; }
    .rail-item small { display: block; margin-top: 3px; color: var(--muted); }
    .variant-switcher {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border: 1px solid #53637c;
      border-radius: 999px;
      background: #111827;
      box-shadow: 0 10px 30px #000b;
      color: #dce6f6;
      z-index: 5;
    }
    .variant-switcher button {
      border: 0;
      background: transparent;
      color: var(--cyan);
      font-size: 18px;
    }
    .variant-name { min-width: 240px; text-align: center; }
    @media (max-width: 760px) {
      .stage { padding: 10px 10px 78px; }
      .terminal { height: calc(100vh - 88px); min-height: 0; }
      .sidebar, .command-rail { display: none; }
      .row { grid-template-columns: 74px minmax(0, 1fr); gap: 8px; }
      .footer { font-size: 10px; }
      .footer-right { max-width: 50%; }
      .variant-name { min-width: 150px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="terminal" aria-label="TASC terminal shell prototype">
      <header class="chrome">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="chrome-title">TASC · Agent Session · prototype</span>
      </header>
      <div id="app"></div>
    </section>
  </main>
  <nav class="variant-switcher" aria-label="Prototype variants">
    <button id="previous" aria-label="Previous variant">‹</button>
    <span class="variant-name" id="variant-name"></span>
    <button id="next" aria-label="Next variant">›</button>
  </nav>
  <script>
    const variants = [
      { key: 'A', name: 'Transcript-first' },
      { key: 'B', name: 'Session workspace' },
      { key: 'C', name: 'Command rail' }
    ];

    const shellContent = `
      <div class="workspace">
        <div class="transcript">
          <div class="banner">
            <pre> _____  ___   ___ ___
|_   _|/ _ \\ / __/ __|
  | | | (_) | (__\\__ \\
  |_|  \\___/ \\___|___/</pre>
            <div class="banner-note">Local-first Agent Skill assistant · startup content scrolls away after the first turn</div>
          </div>
          <div class="row info"><div class="label">· Info</div><div class="body">Profile <strong>default</strong> · GitHub CLI authenticated · 24 skills discovered</div></div>
          <div class="row input"><div class="label">› You</div><div class="body">/skill list</div></div>
          <div class="row working"><div class="label">… Working</div><div class="body">Loading Inventory Projection <span class="dim">[1–8 of 24]</span></div></div>
          <div class="row done"><div class="label">✓ Done</div><div class="body">24 skills available · 8 visible · 0 selected</div></div>
          <div class="row tasc"><div class="label">◆ TASC</div><div class="body">Use Up/Down to focus, Space to select, Enter to run, Esc to cancel.<div class="code">› 01  azure-prepare       tracked · installed<br>  02  azure-storage        tracked · installed<br>  03  rust-best-practices  watched<br>  04  frontend-ui           untracked<br>  05  context-engineering  tracked · installed</div></div></div>
          <div class="row warning"><div class="label">! Warning</div><div class="body">3 inventory rows have local changes; lifecycle actions will show a plan first.</div></div>
          <div class="row next"><div class="label">↳ Next</div><div class="body">Try <strong>/model</strong> to change the session model.</div></div>
        </div>
      </div>`;

    function composer(withPalette = true) {
      return `<div class="composer">
        ${withPalette ? `<div class="palette">
          <div class="palette-row selected"><span>/model</span><small>Choose session model</small></div>
          <div class="palette-row"><span>/skill</span><small>Browse Inventory Projection</small></div>
          <div class="palette-row"><span>/status</span><small>Show Agent Session status</small></div>
          <div class="palette-row"><span>/help</span><small>Browse all Slash Commands</small></div>
        </div>` : ''}
        <div class="prompt-line"><span class="prompt">›</span><span class="draft">/mo</span><span class="cursor">▌</span></div>
        <div class="footer"><span>idle · Profile <strong>default</strong> · 24 skills</span><span class="footer-right">model <strong>auto</strong> · tokens <strong>1,284</strong></span></div>
      </div>`;
    }

    function variantA() {
      return shellContent + composer(true);
    }

    function variantB() {
      return `<div class="workspace">
        <div class="transcript">
          <div class="row info"><div class="label">· Info</div><div class="body">Agent Session ready · Profile <strong>default</strong></div></div>
          <div class="row input"><div class="label">› You</div><div class="body">Find skills for Azure storage and evaluate the top match.</div></div>
          <div class="row tasc"><div class="label">◆ TASC</div><div class="body">I found 6 matching skills. The strongest match is <strong>azure-storage</strong>.</div></div>
          <div class="row done"><div class="label">✓ Done</div><div class="body">Search complete · no files changed · 6 results</div></div>
          <div class="row input"><div class="label">› You</div><div class="body">/model</div></div>
          <div class="row tasc"><div class="label">◆ TASC</div><div class="body">Choose a model, then choose whether it applies to this Agent Session or saves as the Profile default.</div></div>
        </div>
        <aside class="sidebar">
          <div class="side-title">Session</div>
          <div class="side-item active">● default<small>active Profile</small></div>
          <div class="side-item">○ auto<small>session model</small></div>
          <div class="side-item">○ gpt-5.6<small>available model</small></div>
          <div class="side-title" style="margin-top:22px">Activity</div>
          <div class="side-item">✓ Search<small>completed</small></div>
          <div class="side-item">… Model picker<small>awaiting choice</small></div>
        </aside>
      </div>${composer(false)}`;
    }

    function variantC() {
      return `<div class="workspace">
        <aside class="command-rail">
          <div class="side-title">Commands</div>
          <button class="rail-item active"><b>/model</b><small>choose model</small></button>
          <button class="rail-item"><b>/skill</b><small>browse inventory</small></button>
          <button class="rail-item"><b>/evaluation</b><small>run or inspect</small></button>
          <button class="rail-item"><b>/security</b><small>check a skill</small></button>
          <button class="rail-item"><b>/status</b><small>session status</small></button>
          <button class="rail-item"><b>/help</b><small>all commands</small></button>
        </aside>
        <div class="transcript">
          <div class="row info"><div class="label">· Info</div><div class="body">Command Palette browse mode · 6 commands visible</div></div>
          <div class="row tasc"><div class="label">◆ TASC</div><div class="body">The selected command preview stays visible while the transcript remains readable.</div></div>
          <div class="row input"><div class="label">› You</div><div class="body">/model</div></div>
          <div class="row tasc"><div class="label">◆ TASC</div><div class="body">Select a model from the SDK, then choose Agent Session or Profile scope.<div class="code">› auto                 active session · Profile default<br>  gpt-5.6-sol          available<br>  claude-sonnet-5      available<br>  Save as Profile default  →  requires explicit scope choice</div></div></div>
          <div class="row next"><div class="label">↳ Next</div><div class="body">Enter selects · Esc returns to the composer · Page Up/Down pages results.</div></div>
        </div>
      </div>${composer(false)}`;
    }

    function currentVariant() {
      const key = new URLSearchParams(location.search).get('variant') || 'A';
      return variants.findIndex(item => item.key === key) >= 0 ? key : 'A';
    }
    function render() {
      const key = currentVariant();
      document.getElementById('app').innerHTML = key === 'A' ? variantA() : key === 'B' ? variantB() : variantC();
      const item = variants.find(value => value.key === key);
      document.getElementById('variant-name').textContent = `${item.key} · ${item.name}`;
    }
    function move(delta) {
      const index = variants.findIndex(item => item.key === currentVariant());
      const next = variants[(index + delta + variants.length) % variants.length].key;
      history.replaceState({}, '', `?variant=${next}`);
      render();
    }
    document.getElementById('previous').addEventListener('click', () => move(-1));
    document.getElementById('next').addEventListener('click', () => move(1));
    document.addEventListener('keydown', event => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
      if (event.key === 'ArrowLeft') move(-1);
      if (event.key === 'ArrowRight') move(1);
    });
    render();
  </script>
</body>
</html>
