[package]
name = "tasc-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pascalvanderheiden/turbo-agent-skills-cli"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
