[package]
name = "tasc"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pascalvanderheiden/turbo-agent-skills-cli"

[dependencies]
tokio = { version = "1.53.3", features = ["io-std", "io-util", "macros", "rt", "signal", "sync"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tasc-agent = { path = "../tasc-agent" }
tasc-core = { path = "../tasc-core" }
github-copilot-sdk = { version = "=1.0.22", default-features = false, features = ["runtime"] }
async-trait = "=0.1.92"
crossterm = "0.29.0"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
