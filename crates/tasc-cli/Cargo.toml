[package]
name = "tasc"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pascalvanderheiden/turbo-agent-skills-cli"

[dependencies]
tokio = { version = "1.53.3", features = ["io-std", "io-util", "macros", "rt", "signal"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
serde_json = "1"
tasc-agent = { path = "../tasc-agent" }
tasc-core = { path = "../tasc-core" }
github-copilot-sdk = { version = "=1.0.22", default-features = false, features = ["runtime"] }
async-trait = "=0.1.92"
