[workspace]
members = [
  "crates/tasc-core",
  "crates/tasc-cli",
  "crates/tasc-agent",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/pascalvanderheiden/turbo-agent-skills-cli"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
dirs = "5"
